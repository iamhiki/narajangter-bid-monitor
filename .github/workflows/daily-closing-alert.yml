name: 나라장터 마감 임박 입찰 텔레그램 보고 (매일)

# 7일 안에 마감되는 "입찰"(적격심사·최저가 등) 본공고를 매일 아침 텔레그램으로 보낸다.
# 2026-09-29 미팅: 입찰은 공고 후 7일 안에 마감되는 경우가 있어 주간 리포트로는 늦다.
# 공고일 기준으로 수집하므로 30일치를 훑어야 "한참 전에 올라왔지만 이번 주에 마감되는" 건까지 잡힌다.
on:
  schedule:
    # 예비용. 매일 08:10 실행은 외부 예약 서비스(cron-job.org)가 workflow_dispatch API로 깨운다 — GitHub 예약 실행은
    # 몇 시간씩 건너뛰기도 해서(2026-09-29 실측) 하나에만 맡기면 보고가 빠진다. 이 schedule은 그쪽이 멈췄을 때의 안전망이다.
    # 그날 이미 보냈으면 cache/sent-reports.json 기록을 보고 조용히 끝나므로 두 번 오지 않는다 (src/state/sentReports.ts).
    # 매일 09:10 KST = 00:10 UTC. 정각은 GitHub 예약 실행이 몰려 지연이 커서 피한다.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 설정하면 텔레그램을 보내지 않고 미리보기만 출력합니다"
        required: false
        default: "false"
      force:
        description: "true로 설정하면 오늘 이미 보냈어도 다시 보냅니다"
        required: false
        default: "false"

# 두 곳이 거의 같이 깨워도 한 번에 하나만 돈다 — 뒤에 도는 쪽이 앞 실행의 발송 기록을 보고 건너뛴다.
concurrency:
  group: daily-closing-alert
  cancel-in-progress: false

defaults:
  run:
    working-directory: narajangter-bid-monitor

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: narajangter-bid-monitor/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 보고 발송 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: narajangter-bid-monitor/cache/sent-reports.json
          key: sent-daily-${{ github.run_id }}
          restore-keys: sent-daily-

      - name: 과거사업 코퍼스 풀기 (싱크로율용 — 암호 파일은 저장소, 비밀번호는 Secret)
        env:
          CORPUS_PASSPHRASE: ${{ secrets.CORPUS_PASSPHRASE }}
        run: npm run corpus:decrypt

      - name: 마감 임박 입찰 확인 및 텔레그램 보고
        env:
          TZ: Asia/Seoul
          RUN_MODE: daily
          # GitHub 서버(미국)→나라장터 접속이 가끔 1~2분 끊긴다. 재시도를 20·40·80·160·320초 간격으로 벌려 넘긴다
          API_MAX_RETRIES: "5"
          API_RETRY_DELAY_MS: "20000"
          LOOKBACK_DAYS: "30"
          NARA_BID_SERVICE_KEY: ${{ secrets.NARA_BID_SERVICE_KEY }}
          NARA_PRESTD_SERVICE_KEY: ${{ secrets.NARA_PRESTD_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_SEND: ${{ github.event.inputs.force || 'false' }}
        run: npm run report

      - name: 보고 발송 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: narajangter-bid-monitor/cache/sent-reports.json
          key: sent-daily-${{ github.run_id }}
