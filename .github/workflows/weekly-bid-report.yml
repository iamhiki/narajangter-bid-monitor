name: 나라장터 입찰 모니터링 주간 리포트

on:
  schedule:
    # 매주 월요일 07:00 KST = 일요일 22:00 UTC (원래 운영 주기 — 테스트 끝나면 이걸로 되돌리기)
    # - cron: "0 22 * * 0"
    # [테스트용] 매일 07:00 KST = 매일 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 설정하면 이메일을 보내지 않고 리포트만 생성합니다"
        required: false
        default: "false"

defaults:
  run:
    working-directory: narajangter-bid-monitor

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: narajangter-bid-monitor/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npm run typecheck

      - name: 주간 리포트 실행 (시트 기록 + 텔레그램/이메일 발송)
        env:
          NARA_BID_SERVICE_KEY: ${{ secrets.NARA_BID_SERVICE_KEY }}
          NARA_PRESTD_SERVICE_KEY: ${{ secrets.NARA_PRESTD_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # 텔레그램 알림 — 시크릿이 없으면 값이 빈 문자열이 되어 자동으로 건너뛴다(이메일은 그대로 발송).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # 구글 시트 피드백 기록 — 시크릿이 없으면 자동으로 건너뛴다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FEEDBACK_SHEET_ID: ${{ secrets.FEEDBACK_SHEET_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # LOOKBACK_DAYS: "7"  # 원래 값 (매주 실행 기준) — 테스트 끝나면 이걸로 되돌리기
          LOOKBACK_DAYS: "1" # [테스트용] 매일 실행이라 최근 1일치만 조회
        run: npm run report

      - name: 리포트 파일 업로드 (백업)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-report-${{ github.run_id }}
          path: narajangter-bid-monitor/output/
          retention-days: 90
          if-no-files-found: ignore
