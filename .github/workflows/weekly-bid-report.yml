name: 나라장터 입찰 모니터링 주간 리포트

# 매주 한 번 기간 전체를 모아 이메일로 보내고, "입찰"을 뺀 공고(협상·규격가격동시·사전규격)를 텔레그램으로 보낸다.
# "입찰"(적격심사·최저가 등)은 마감이 짧아 daily-closing-alert.yml이 매일 아침 보낸다.
on:
  schedule:
    # 매주 월요일 07:00 KST = 일요일 22:00 UTC
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 설정하면 이메일을 보내지 않고 리포트만 생성합니다"
        required: false
        default: "false"

defaults:
  run:
    working-directory: narajangter-bid-monitor

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: narajangter-bid-monitor/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npm run typecheck

      - name: 과거사업 코퍼스 풀기 (싱크로율용 — 암호 파일은 저장소, 비밀번호는 Secret)
        env:
          CORPUS_PASSPHRASE: ${{ secrets.CORPUS_PASSPHRASE }}
        run: npm run corpus:decrypt

      - name: 주간 리포트 실행 (시트 기록 + 이메일 발송)
        env:
          # 조회 기간과 마감 시각을 한국 시간으로 계산한다. 없으면 UTC로 돌아 9시간 어긋난다.
          TZ: Asia/Seoul
          RUN_MODE: weekly
          LOOKBACK_DAYS: "7"
          NARA_BID_SERVICE_KEY: ${{ secrets.NARA_BID_SERVICE_KEY }}
          NARA_PRESTD_SERVICE_KEY: ${{ secrets.NARA_PRESTD_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # 주간 텔레그램 보고와 실행 실패 알림에 쓴다. 시크릿이 없으면 자동으로 건너뛴다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # 구글 시트 피드백 기록 — 시크릿이 없으면 자동으로 건너뛴다.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FEEDBACK_SHEET_ID: ${{ secrets.FEEDBACK_SHEET_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: npm run report

      - name: 리포트 파일 업로드 (백업)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-report-${{ github.run_id }}
          path: narajangter-bid-monitor/output/
          retention-days: 90
          if-no-files-found: ignore
