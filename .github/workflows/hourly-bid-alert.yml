name: 나라장터 새 공고 텔레그램 알림 (매시간)

# 매시간 최근 하루치를 조회해서, 아직 알리지 않은 공고만 텔레그램으로 보낸다.
# 하루치를 겹쳐 보는 이유: 예약 실행은 늦게 시작되거나 가끔 건너뛰어서, 한 시간치만 보면
# 그 사이 공고를 놓친다. 이미 알린 공고는 cache/notified.json 기록으로 거른다.
on:
  schedule:
    # 매시 7분. 정각은 GitHub 예약 실행이 몰려 지연이 커서 피한다.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 설정하면 텔레그램을 보내지 않고 미리보기만 출력합니다"
        required: false
        default: "false"

# 앞 실행이 끝나기 전에 다음 실행이 겹치면 같은 공고를 두 번 보낼 수 있어 한 번에 하나만 돈다.
concurrency:
  group: hourly-bid-alert
  cancel-in-progress: false

defaults:
  run:
    working-directory: narajangter-bid-monitor

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: narajangter-bid-monitor/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 이미 알린 공고 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: narajangter-bid-monitor/cache/notified.json
          key: notified-${{ github.run_id }}
          restore-keys: notified-

      - name: 새 공고 확인 및 텔레그램 알림
        env:
          TZ: Asia/Seoul
          RUN_MODE: hourly
          LOOKBACK_DAYS: "1"
          NARA_BID_SERVICE_KEY: ${{ secrets.NARA_BID_SERVICE_KEY }}
          NARA_PRESTD_SERVICE_KEY: ${{ secrets.NARA_PRESTD_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FEEDBACK_SHEET_ID: ${{ secrets.FEEDBACK_SHEET_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: npm run report

      - name: 이미 알린 공고 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: narajangter-bid-monitor/cache/notified.json
          key: notified-${{ github.run_id }}
